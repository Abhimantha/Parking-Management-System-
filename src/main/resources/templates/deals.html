<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Deals')}"></head>
<body th:replace="~{fragments/layout :: layout(~{::section}, 'deals')}">
<section>
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 m-0"><i class="bi bi-stars me-2"></i>Deals</h1>
        <a class="btn btn-outline-light" th:href="@{/find-parking}">
            <i class="bi bi-search me-1"></i> Find Parking
        </a>
    </div>

    <div class="card shadow-sm border-0 card-lift">
        <div class="card-body">
            <div id="grid" class="row g-3">
                <div class="text-muted">Loading available deals…</div>
            </div>
        </div>
    </div>

    <script>
        const byId = (id) => document.getElementById(id);

        function badge(v){
          return `<span class="badge rounded-pill text-bg-primary">${v}</span>`;
        }
        function fmtDate(d){ return d || '—'; }
        function fmtOff(v,type){
          const n = Number(v||0);
          return (String(type).toUpperCase()==='FLAT') ? `₹ ${n.toFixed(2)}` : `${n.toFixed(2)}%`;
        }

        async function loadDeals(){
          try{
            // Read-only: only active + currently valid + type=PROMO
           const data = await api.get('/api/pricing/deals?activeOnly=true&current=true');

            const grid = byId('grid');
            if (!Array.isArray(data) || data.length === 0) {
              grid.innerHTML = `<div class="col-12 text-muted">No active deals right now.</div>`;
              return;
            }

            grid.innerHTML = data.map(r => {
              const code = r.promoCode || '';
              const off  = fmtOff(r.effectValue, r.effectType);
              return `
                <div class="col-12 col-md-6 col-lg-4">
                  <div class="lp-card p-3 h-100">
                    <div class="d-flex align-items-start justify-content-between">
                      <div>
                        <div class="fw-semibold">${r.name ? r.name.replace(/\s*\[CODE:.*?\]\s*/,'') : 'Promo'}</div>
                        <div class="small text-muted">Valid ${fmtDate(r.startDate)} → ${fmtDate(r.endDate)}</div>
                      </div>
                      <div class="h5 m-0">${off}</div>
                    </div>
                    <div class="mt-3 d-flex align-items-center gap-2">
                      ${code ? badge(code) : '<span class="badge text-bg-secondary">Auto-applied</span>'}
                    </div>
                    <div class="mt-3 d-flex gap-2">
                      ${code ? `
                        <button class="btn btn-sm btn-primary" onclick="copyCode('${code}')">
                          <i class="bi bi-clipboard-check me-1"></i> Copy code
                        </button>` : ''
                      }
                      <a class="btn btn-sm btn-outline-secondary" href="/find-parking">
                        Use this deal
                      </a>
                    </div>
                  </div>
                </div>`;
            }).join('');
          } catch(e){
            byId('grid').innerHTML = `<div class="col-12 text-danger">Failed to load deals: ${e.message || e}</div>`;
          }
        }

        async function copyCode(code){
          try { await navigator.clipboard.writeText(code); toast('Code copied'); }
          catch { toast('Copy failed', false); }
        }

        document.addEventListener('DOMContentLoaded', loadDeals);
    </script>

    <style>
        /* Uses lp-card style already present elsewhere */
        .lp-card{ border:0; border-radius:1rem; background:#fff; box-shadow:0 10px 30px rgba(2,6,23,.08); }
        body.bg-body-tertiary .lp-card{ background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); }
    </style>
</section>
</body>
</html>
