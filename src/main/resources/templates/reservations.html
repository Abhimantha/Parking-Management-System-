<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservations')}"></head>
<body th:replace="~{fragments/layout :: layout(~{::section}, 'reservations')}">
<section>
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 m-0"><i class="bi bi-journal-bookmark me-2"></i>Reservations</h1>
        <a class="btn btn-primary" th:href="@{/find-parking}">
            <i class="bi bi-plus-lg me-1"></i>New Reservation
        </a>
    </div>

    <!-- feedback -->
    <div th:if="${msg}" hidden th:text="${msg}" id="flashMsg"></div>
    <div th:if="${err}" hidden th:text="${err}" id="flashErr"></div>

    <div class="card shadow-sm border-0 card-lift">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Slot</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reservations}"
                    th:with="isActive=${#strings.equalsIgnoreCase(r.status,'ACTIVE')}">
                    <td th:text="${r.id}">1</td>
                    <td th:text="${r.slot != null ? r.slot.id : '—'}">3</td>
                    <td th:text="${r.startTime}">start</td>
                    <td th:text="${r.endTime}">end</td>
                    <td>
                        <span class="badge rounded-pill text-bg-success"
                              th:if="${#strings.equalsIgnoreCase(r.status,'ACTIVE')}">ACTIVE</span>
                        <span class="badge rounded-pill text-bg-secondary"
                              th:if="${#strings.equalsIgnoreCase(r.status,'CANCELLED')}">CANCELLED</span>
                        <span class="badge rounded-pill text-bg-primary"
                              th:if="${#strings.equalsIgnoreCase(r.status,'COMPLETED')}">COMPLETED</span>
                        <span class="badge rounded-pill text-bg-warning text-dark"
                              th:if="${#strings.equalsIgnoreCase(r.status,'EXPIRED')}">EXPIRED</span>
                    </td>
                    <td class="text-end">
                        <!-- Only show for ACTIVE (for all roles) -->
                        <button class="btn btn-sm btn-outline-primary me-2"
                                th:if="${isActive}"
                                data-bs-toggle="modal" data-bs-target="#resEditModal"
                                th:attr="data-id=${r.id},
                                         data-start=${#temporals.format(r.startTime, 'yyyy-MM-dd''T''HH:mm')},
                                         data-end=${#temporals.format(r.endTime, 'yyyy-MM-dd''T''HH:mm')}">
                            Edit
                        </button>

                        <button class="btn btn-sm btn-outline-danger"
                                th:if="${isActive}"
                                data-bs-toggle="modal" data-bs-target="#resCancelModal"
                                th:attr="data-id=${r.id}">
                            Cancel
                        </button>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(reservations)}">
                    <td colspan="6" class="text-center text-muted py-4">No reservations yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal: posts to /reservations/update -->
    <div class="modal fade" id="resEditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/reservations/update}">
                <div class="modal-header">
                    <h5 class="modal-title">Edit reservation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body row g-3">
                    <input type="hidden" name="id" id="resId">
                    <div class="col-12">
                        <label class="form-label">Start</label>
                        <input type="datetime-local" class="form-control" name="start" id="startTime">
                    </div>
                    <div class="col-12">
                        <label class="form-label">End</label>
                        <input type="datetime-local" class="form-control" name="end" id="endTime">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Status</label>
                        <select class="form-select" name="status" id="resStatus">
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Cancel Modal: posts to /reservations/cancel -->
    <div class="modal fade" id="resCancelModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" method="post" th:action="@{/reservations/cancel}">
                <div class="modal-header">
                    <h5 class="modal-title">Cancel reservation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" name="id" id="cancelResId">
                    <div class="mb-3">
                        <label class="form-label">Reason</label>
                        <textarea name="reason" class="form-control" rows="3" placeholder="Optional unless required by settings"></textarea>
                    </div>
                    <div class="alert alert-warning mb-0">
                        On cancellation, any paid amount will be refunded within 24 hours.
                    </div>
                </div>

                <div class="modal-footer">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Cancel reservation</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        // Populate Edit modal
        const editModal = document.getElementById('resEditModal');
        editModal?.addEventListener('show.bs.modal', (ev) => {
          const btn = ev.relatedTarget;
          document.getElementById('resId').value     = btn?.getAttribute('data-id') || '';
          document.getElementById('startTime').value = btn?.getAttribute('data-start') || '';
          document.getElementById('endTime').value   = btn?.getAttribute('data-end') || '';
          document.getElementById('resStatus').value = 'COMPLETED';
        });

        // Populate Cancel modal
        const cancelModal = document.getElementById('resCancelModal');
        cancelModal?.addEventListener('show.bs.modal', (ev) => {
          const btn = ev.relatedTarget;
          document.getElementById('cancelResId').value = btn?.getAttribute('data-id') || '';
        });
    </script>
</section>
</body>
</html>
