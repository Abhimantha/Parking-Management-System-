<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lots')}"></head>
<body th:replace="~{fragments/layout :: layout(~{::section}, 'lots')}">
<section>
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 m-0">Lot Management</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#lotModal" onclick="openLotModal()">Add Lot</button>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card">
                <div class="card-body">
                    <h5 class="mb-3">Lots</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead><tr><th>#</th><th>Name</th><th>Location</th><th>Capacity</th><th>Used</th><th class="text-end">Actions</th></tr></thead>
                            <tbody id="lotRows"><tr><td colspan="6">Loading…</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="m-0">Slots in <span id="lotTitle">—</span></h5>
                        <button class="btn btn-outline-primary btn-sm" id="addSlotBtn" disabled data-bs-toggle="modal" data-bs-target="#slotModal">Add Slot</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead><tr><th>#</th><th>Number</th><th>Type</th><th>Rate</th><th>Status</th></tr></thead>
                            <tbody id="slotRows"><tr><td colspan="5">Select a lot</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lot modal -->
    <div class="modal fade" id="lotModal" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" onsubmit="saveLot(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="lotModalTitle">Add Lot</h5>
                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-3">
                    <input type="hidden" id="lotId">
                    <div class="col-12">
                        <label class="form-label">Name</label>
                        <input id="lotName" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Location</label>
                        <input id="lotLocation" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Total capacity</label>
                        <input id="lotCapacity" type="number" min="0" class="form-control" value="0">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Slot modal -->
    <div class="modal fade" id="slotModal" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" onsubmit="saveSlot(event)">
                <div class="modal-header">
                    <h5 class="modal-title">Add Slot</h5>
                    <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-3">
                    <input type="hidden" id="slotLotId">
                    <div class="col-12">
                        <label class="form-label">Slot number</label>
                        <input id="slotNumber" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Type</label>
                        <select id="slotType" class="form-select">
                            <option>COMPACT</option>
                            <option>LARGE</option>
                            <option>EV</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Price rate</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input id="slotRate" type="number" min="0" step="0.01" class="form-control" value="0.00">
                        </div>
                    </div>
                    <!-- Optional: choose a Level in this Lot -->
                    <div class="col-12">
                        <label class="form-label">Level (optional)</label>
                        <select id="slotLevel" class="form-select">
                            <option value="">— none —</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-primary" type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>

<script>
    let lotModal, slotModal, selectedLotId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      lotModal = new bootstrap.Modal('#lotModal');
      slotModal = new bootstrap.Modal('#slotModal');
      await loadLots();
    });

    async function loadLots(){
      const data = await api.get('/api/lotmgmt/lots');
      const rows = data.map(l => `
        <tr class="${selectedLotId===l.id?'table-primary':''}">
          <td>${l.id}</td>
          <td><a href="#" onclick="selectLot(${l.id}, '${escapeHtml(l.name)}')">${escapeHtml(l.name)}</a></td>
          <td>${escapeHtml(l.location)}</td>
          <td>${l.totalCapacity ?? 0}</td>
          <td>${l.slotsCount ?? 0}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-2" onclick='editLot(${JSON.stringify(l)})'>Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="removeLot(${l.id})">Delete</button>
          </td>
        </tr>`).join('');
      byId('lotRows').innerHTML = rows || `<tr><td colspan="6">No lots yet</td></tr>`;
      if (selectedLotId) await selectLot(selectedLotId);
    }

    async function selectLot(id, name){
      selectedLotId = id;
      byId('lotTitle').textContent = name ?? `Lot #${id}`;
      byId('addSlotBtn').disabled = false;
      byId('slotLotId').value = id;

      // load slots
      const slots = await api.get(`/api/lotmgmt/lots/${id}/slots`);
      byId('slotRows').innerHTML = (slots.map(s => `
        <tr>
          <td>${s.id}</td>
          <td>${escapeHtml(s.slotNumber)}</td>
          <td><span class="badge text-bg-secondary">${s.type}</span></td>
          <td>₹ ${Number(s.priceRate||0).toFixed(2)}</td>
          <td><span class="badge ${s.status==='AVAILABLE'?'text-bg-success':(s.status==='RESERVED'?'text-bg-warning':'text-bg-dark')}">${s.status}</span></td>
        </tr>`).join('')) || `<tr><td colspan="5">No slots yet</td></tr>`;

      // load levels for this lot (optional)
      const lvls = await api.get(`/api/lotmgmt/lots/${id}/levels`).catch(()=>[]);
      byId('slotLevel').innerHTML = `<option value="">— none —</option>` +
        lvls.map(v => `<option value="${v.id}">${escapeHtml(v.name)}</option>`).join('');
    }

    function openLotModal(){
      byId('lotModalTitle').textContent = 'Add Lot';
      byId('lotId').value = '';
      byId('lotName').value = '';
      byId('lotLocation').value = '';
      byId('lotCapacity').value = '0';
    }

    function editLot(l){
      byId('lotModalTitle').textContent = 'Edit Lot';
      byId('lotId').value = l.id;
      byId('lotName').value = l.name || '';
      byId('lotLocation').value = l.location || '';
      byId('lotCapacity').value = l.totalCapacity ?? 0;
      lotModal.show();
    }

    async function saveLot(e){
      e.preventDefault();
      const dto = {
        name: val('lotName'),
        location: val('lotLocation'),
        totalCapacity: Number(val('lotCapacity')||0)
      };
      const id = val('lotId');
      if (id) await api.put(`/api/lotmgmt/lots/${id}`, dto);
      else    await api.post('/api/lotmgmt/lots', dto);
      toast('Lot saved');
      lotModal.hide();
      await loadLots();
    }

    async function removeLot(id){
      if (!confirm('Delete this lot? (must be empty)')) return;
      await api.delete(`/api/lotmgmt/lots/${id}`);
      if (selectedLotId === id) {
        selectedLotId = null; byId('slotRows').innerHTML = '<tr><td colspan="5">Select a lot</td></tr>'; byId('lotTitle').textContent='—'; byId('addSlotBtn').disabled = true;
      }
      toast('Lot deleted');
      await loadLots();
    }

    document.getElementById('slotModal')?.addEventListener('show.bs.modal', () => {
      if (!selectedLotId){ alert('Select a lot first'); return; }
      byId('slotLotId').value = selectedLotId;
      byId('slotNumber').value = '';
      byId('slotType').value = 'COMPACT';
      byId('slotRate').value = '0.00';
    });

    async function saveSlot(e){
      e.preventDefault();
      const lotId = val('slotLotId');
      if (!lotId){ alert('Select a lot'); return; }
      const dto = {
        slotNumber: val('slotNumber'),
        type: val('slotType'),
        priceRate: val('slotRate'),
        levelId: val('slotLevel') || null
      };
      await api.post(`/api/lotmgmt/lots/${lotId}/slots`, dto);
      toast('Slot added');
      slotModal.hide();
      await selectLot(Number(lotId));
    }

    // helpers
    function byId(id){ return document.getElementById(id); }
    function val(id){ return byId(id)?.value ?? ''; }
    function escapeHtml(s){ return (s??'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
</script>
