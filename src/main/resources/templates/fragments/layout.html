<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} ?: 'Parking System'">Parking System</title>

    <!-- SPRING SECURITY CSRF for AJAX -->
    <meta th:if="${_csrf}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="_csrf_parameter" th:content="${_csrf.parameterName}"/>

    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- App styles -->
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <!-- ===== Visual polish + theming (scoped + safe) ===== -->
    <style>
        /* Dark theme */
        [data-bs-theme='dark'] body.bg-body-tertiary{
          background:
            radial-gradient(1200px 700px at 10% -10%, #0b1328 0%, transparent 60%),
            radial-gradient(900px 540px at 90% -5%, #0a0f22 0%, transparent 65%),
            radial-gradient(1600px 900px at 50% 120%, #0a1225 0%, transparent 70%),
            linear-gradient(#070a12, #0b0f1d 35%, #0a0c18);
          color: #e9edf7;
        }
        /* Light theme */
        [data-bs-theme='light'] body.bg-body-tertiary{
          background:
            radial-gradient(1000px 600px at -10% -10%, #ffffff 0%, transparent 60%),
            radial-gradient(800px 480px at 110% -10%, #f5f9ff 0%, transparent 65%),
            linear-gradient(#ffffff, #f6f7fb 35%, #eef2f8);
          color: #0b0f18;
        }
        .bg-gradient-primary{
          --violet:#7c3aed; --cyan:#22d3ee; --blue:#3b82f6;
          background:
            linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02)) border-box,
            linear-gradient(135deg, rgba(124,58,237,.55), rgba(34,211,238,.45), rgba(59,130,246,.55)) border-box;
          border-bottom: 1px solid rgba(255,255,255,.14) !important;
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          position: sticky; top: 0; z-index: 1030;
        }
        [data-bs-theme='light'] .bg-gradient-primary{
          background:
            linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.6)) border-box,
            linear-gradient(135deg, rgba(124,58,237,.20), rgba(34,211,238,.15), rgba(59,130,246,.20)) border-box;
          border-bottom: 1px solid rgba(0,0,0,.06) !important;
        }
        .bg-gradient-primary::after{
          content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
          background: linear-gradient(90deg, transparent, rgba(34,211,238,.6), transparent);
          opacity:.6;
        }
        .navbar.scrolled{
          background:
            linear-gradient(180deg, rgba(7,10,18,.65), rgba(7,10,18,.55)) border-box,
            linear-gradient(135deg, rgba(124,58,237,.4), rgba(34,211,238,.32), rgba(59,130,246,.4)) border-box;
          box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }
        .navbar .navbar-brand{
          letter-spacing:.2px; color:#f4f7ff !important;
          display:flex; align-items:center; gap:.4rem;
        }
        [data-bs-theme='light'] .navbar .navbar-brand{ color:#0a0f1b !important; }
        .navbar .navbar-brand .bi{ filter: drop-shadow(0 4px 10px rgba(124,58,237,.35)); }
        .navbar .nav-link{ color:#d7e3ff; opacity:.9; position:relative; transition:opacity .15s ease, transform .15s ease; }
        [data-bs-theme='light'] .navbar .nav-link{ color:#0a0f1b; opacity:.85; }
        .navbar .nav-link:hover{ opacity:1; transform: translateY(-1px); }
        .navbar .nav-link::after{
          content:""; position:absolute; left:10%; right:10%; bottom:.35rem; height:2px;
          background: linear-gradient(90deg, transparent, rgba(34,211,238,.9), rgba(124,58,237,.9), transparent);
          transform: scaleX(0); transform-origin: 50% 50%; transition: transform .18s ease;
        }
        .navbar .nav-link:hover::after{ transform: scaleX(1); }
        .navbar .nav-link.active{
          color:#0b0f18; background: linear-gradient(135deg, #22d3ee, #7c3aed);
          border-radius: 999px; padding-inline: .9rem;
          box-shadow: 0 6px 18px rgba(124,58,237,.35);
        }
        .navbar .nav-link.active::after{ display:none; }
        .navbar .btn-outline-light{
          --bs-btn-color:#dce7ff; --bs-btn-border-color:rgba(255,255,255,.5);
          --bs-btn-hover-bg:#ffffff; --bs-btn-hover-color:#0a0f1b;
        }
        .navbar .btn-light{ --bs-btn-bg:#ffffff; --bs-btn-color:#0a0f1b; }
        [data-bs-theme='light'] .navbar .btn-outline-light{
          --bs-btn-color:#0a0f1b; --bs-btn-border-color:rgba(0,0,0,.35);
          --bs-btn-hover-bg:#0a0f1b; --bs-btn-hover-color:#ffffff;
        }
        footer.bg-white{
          background: rgba(255,255,255,.06) !important;
          border-top: 1px solid rgba(255,255,255,.14) !important;
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          color:#b8c7de;
        }
        [data-bs-theme='dark'] main.container{ color:#e9edf7; }
        [data-bs-theme='dark'] .text-muted, [data-bs-theme='dark'] .muted{ color:#b7c6df !important; }
        [data-bs-theme='light'] main.container{ color:#0b0f18; }
        [data-bs-theme='light'] .text-muted, [data-bs-theme='light'] .muted{ color:#5b6778 !important; }
    </style>
</head>

<body class="bg-body-tertiary" th:fragment="layout(content, page)" data-bs-theme="dark">
<nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <i class="bi bi-parking me-1"></i> LankaPark
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navContent" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item d-none" id="navUsers">
                    <a class="nav-link" th:classappend="${page}=='users' ? 'active'" th:href="@{/users}">Users</a>
                </li>
                <li class="nav-item d-none" id="navLots">
                    <a class="nav-link" th:classappend="${page}=='lots' ? 'active'" th:href="@{/lots}">Lots</a>
                </li>
                <li class="nav-item d-none" id="navSlots">
                    <a class="nav-link" th:classappend="${page}=='slots' ? 'active'" th:href="@{/slots}">Slots</a>
                </li>
                <li class="nav-item d-none" id="navReservations">
                    <a class="nav-link" th:classappend="${page}=='reservations' ? 'active'" th:href="@{/reservations}">Reservations</a>
                </li>
                <li class="nav-item d-none" id="navPayments">
                    <a class="nav-link" th:classappend="${page}=='payments' ? 'active'" th:href="@{/payments}">Payments</a>
                </li>

                <!-- Reports is hidden by default; JS will reveal it for ADMIN/MANAGER/DRIVER -->
                <li class="nav-item d-none" id="navReports">
                    <a class="nav-link" th:classappend="${page}=='reports' ? 'active'" th:href="@{/reports}">
                        Reports
                    </a>
                </li>

                <li class="nav-item d-none" id="navSettings">
                    <a class="nav-link" th:classappend="${page}=='settings' ? 'active'" th:href="@{/settings}">Settings</a>
                </li>
                <li class="nav-item" id="navMap">
                    <a class="nav-link" th:classappend="${page}=='find' ? 'active'" th:href="@{/find-parking}">Find Parking</a>
                </li>
                <li class="nav-item d-none" id="navPricing">
                    <a class="nav-link" th:classappend="${page}=='pricing' ? 'active'" th:href="@{/pricing}">Pricing</a>
                </li>
                <li class="nav-item d-none" id="navLogs">
                    <a class="nav-link" th:classappend="${page}=='logs' ? 'active'" th:href="@{/logs}">Logs</a>
                </li>
                <li class="nav-item d-none" id="navDeals">
                    <a class="nav-link" th:classappend="${page}=='deals' ? 'active'" th:href="@{/deals}">Deals</a>
                </li>
            </ul>

            <!-- RIGHT SIDE: anon vs authed -->
            <div class="ms-auto d-flex align-items-center gap-2">
                <button id="themeToggle" class="btn btn-sm btn-outline-light" type="button" title="Toggle theme">
                    <i class="bi bi-moon-stars" id="themeIcon"></i>
                </button>
                <button id="uiToggle" class="btn btn-sm btn-outline-light" type="button" title="Toggle UI style">
                    <i class="bi bi-magic" id="uiIcon"></i>
                </button>
                <!-- Anonymous -->
                <div id="navAnon" class="d-flex align-items-center gap-2">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </a>
                    <a class="btn btn-sm btn-light" th:href="@{/register}">
                        <i class="bi bi-person-plus me-1"></i> Sign up
                    </a>
                </div>

                <!-- Authenticated -->
                <div id="navAuthed" class="d-none align-items-center gap-2">
                    <a class="btn btn-sm btn-outline-light d-flex align-items-center"
                       th:href="@{/profile}" title="Profile">
                        <i class="bi bi-person-circle fs-5"></i>
                    </a>
                    <span id="navUserLabel" class="text-light small"></span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:replace="${content}">Content goes here</div>
</main>

<footer class="border-top py-4 bg-white">
    <div class="container text-center text-muted small">
        © <span id="year"></span> LankaPark — All rights reserved
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/components.js}"></script>

<!-- Dialogs for server-side flash messages -->
<div id="flashMsg" th:if="${msg}" th:text="${msg}" hidden></div>
<div id="flashErr" th:if="${err}" th:text="${err}" hidden></div>

<script>
    (function(){
      const nav = document.querySelector('.navbar');
      const onScroll = () => nav?.classList.toggle('scrolled', window.scrollY > 6);
      onScroll(); window.addEventListener('scroll', onScroll, { passive:true });
    })();

    function readCookie(name){
      const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([$?*|{}\]\\^])/g,'\\$1') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function csrfInfo(){
      const token  =
        document.querySelector('meta[name="_csrf"]')?.content ||
        document.querySelector('meta[name="csrf-token"]')?.content ||
        readCookie('XSRF-TOKEN');
      const header = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
      const param  = document.querySelector('meta[name="_csrf_parameter"]')?.content || '_csrf';
      return { token, header, param };
    }
    function baseHeaders(){
      const h = { 'Accept':'application/json' };
      const { token, header } = csrfInfo();
      if (token) {
        h[header] = token;
        h['X-CSRF-TOKEN'] = token;
        h['X-XSRF-TOKEN'] = token;
      }
      return h;
    }
    function jsonHeaders(){
      const h = baseHeaders();
      h['Content-Type'] = 'application/json';
      return h;
    }
    async function handleResponse(res){
      const txt = await res.text();
      if (!res.ok) {
        try { const j = JSON.parse(txt); throw new Error(j.message || txt || res.statusText); }
        catch { throw new Error(txt || res.statusText); }
      }
      if (!txt) return null;
      try { return JSON.parse(txt); } catch { return txt; }
    }

    window.api = {
      async get(u){ return handleResponse(await fetch(u, { headers: baseHeaders(), credentials:'same-origin' })); },
      async post(u, b){ return handleResponse(await fetch(u, { method:'POST', headers: jsonHeaders(), body: JSON.stringify(b), credentials:'same-origin' })); },
      async put(u, b){
        const { token, param } = csrfInfo();
        const sep = u.includes('?') ? '&' : '?';
        const url = token ? `${u}${sep}${encodeURIComponent(param)}=${encodeURIComponent(token)}` : u;
        return handleResponse(await fetch(url, { method:'PUT', headers: jsonHeaders(), body: JSON.stringify(b), credentials:'same-origin' }));
      },
      async patch(u, b){
        const { token, param } = csrfInfo();
        const sep = u.includes('?') ? '&' : '?';
        const url = token ? `${u}${sep}${encodeURIComponent(param)}=${encodeURIComponent(token)}` : u;
        const opts = b === undefined
          ? { method:'PATCH', headers: baseHeaders(), credentials:'same-origin' }
          : { method:'PATCH', headers: jsonHeaders(), body: JSON.stringify(b), credentials:'same-origin' };
        return handleResponse(await fetch(url, opts));
      },
      async delete(u){
        const { token, param } = csrfInfo();
        const sep = u.includes('?') ? '&' : '?';
        const url = token ? `${u}${sep}${encodeURIComponent(param)}=${encodeURIComponent(token)}` : u;
        return handleResponse(await fetch(url, { method:'DELETE', headers: baseHeaders(), credentials:'same-origin' }));
      }
    };

    (async function(){
      const $ = (id)=>document.getElementById(id);

      // collect roles from multiple possible shapes and normalize
      function roleSet(me){
        const set = new Set();
        const add = (val) => {
          if (!val) return;
          let s = String(val).toUpperCase();
          if (s.startsWith('ROLE_')) s = s.slice(5); // ROLE_USER -> USER
          set.add(s);
        };
        add(me?.role);
        (me?.roles || []).forEach(add);
        (me?.authorities || []).forEach(a => add(a?.authority || a));
        return set;
      }

      let me = null;
      try { me = await api.get('/api/me'); } catch (_) {}

      const roles = roleSet(me);

      // Pricing: Admin/Manager only (editable UI)
      if (roles.has('ADMIN') || roles.has('MANAGER')) {
        $('navPricing')?.classList.remove('d-none');
      }

      // Deals: Drivers & Users only (read-only)
      if (roles.has('DRIVER') || roles.has('USER')) {
        $('navDeals')?.classList.remove('d-none');
      }

      // NEW: Reports menu visible to ADMIN, MANAGER, DRIVER
      if (roles.has('ADMIN') || roles.has('MANAGER') || roles.has('DRIVER')) {
        $('navReports')?.classList.remove('d-none');
      }

      // Toggle anon vs authed chrome
      if (me && (me.email || me.username)) {
        $('navAnon')?.classList.add('d-none');
        const authed = $('navAuthed');
        if (authed) {
          authed.classList.remove('d-none');
          const label = $('navUserLabel');
          if (label) label.textContent = me.email || me.username || '';
        }
      }
    })();

    // Year in footer
    (function(){ const y = document.getElementById('year'); if (y) y.textContent = new Date().getFullYear(); })();
</script>

</body>
</html>
